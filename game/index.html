<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="The Midnight Heist: a top-down heist game. Sneak past guards and cameras, steal the loot, reach the exit before the alarm fills.">
<link rel="icon" href="data:,">
<title>The Midnight Heist</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07060d; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="The Midnight Heist: sneak past guards and cameras, steal the loot and reach the exit before the alarm fills"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
